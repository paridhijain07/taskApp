services:
  backend:
    build: .
    env_file: ./.env
    ports: "5000:5000"
    depends_on: [mongo, redis]
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes: 
      - mongo_data:/data/db
    ports: "27017:27017"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: "6379:6379"
    restart: unless-stopped

volumes:
  mongo_data:

